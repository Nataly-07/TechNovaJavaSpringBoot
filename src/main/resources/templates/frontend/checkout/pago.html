<div th:fragment="content" xmlns:th="http://www.thymeleaf.org">
  <h2 class="section-title">Forma de pago</h2>
  <th:block th:if="${session.error != null}">
    <div class="info-box" style="background:#ffecec;color:#b00020;margin-bottom:10px;" th:text="${session.error}">Error</div>
  </th:block>
  <form method="POST" th:action="@{/checkout/pago}" id="pagoForm">
    <input type="hidden" name="metodoPago" value="paypal_sandbox" />

    <div class="formulario-pago">
      <h3 style="color: #667eea; margin-bottom: 10px; font-size: 1.1em;">Pasarela seleccionada: PayPal Sandbox</h3>
      <p style="margin: 0 0 10px; color: #4b5563;">
        Serás redirigido a PayPal Sandbox para completar el pago de forma segura.
      </p>
      <ul style="margin: 0; padding-left: 18px; color: #4b5563;">
        <li>Si el pago queda aprobado, tu compra se confirmará automáticamente.</li>
        <li>Si el pago falla o queda pendiente, volverás con un mensaje de estado.</li>
      </ul>
    </div>

    <button type="submit" class="account">
      Continuar con PayPal
    </button>
  </form>
  
  <style>
    .formulario-pago {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      border: 2px solid #e0e0e0;
    }
    
    .formulario-pago .form-group {
      margin-bottom: 15px;
    }
    
    .formulario-pago input,
    .formulario-pago select {
      padding: 12px 16px;
      border: 2px solid var(--sinbad);
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.3s ease;
    }
    
    .formulario-pago input:focus,
    .formulario-pago select:focus {
      outline: none;
      border-color: #667eea;
    }
  </style>
  
  <script th:inline="javascript">
    // Fragmento sin lógica JS de formularios simulados.
  </script>
</div>
