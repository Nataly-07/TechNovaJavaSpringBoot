<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Venta Punto Físico - Technova</title>

    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" th:href="@{/frontend/css/estilodas.css}">
    <link rel="stylesheet" th:href="@{/frontend/css/stilotech.css}">
    <link rel="stylesheet" th:href="@{/frontend/css/color-palette.css}">
    <style>
        .pos-container { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
        .pos-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
        .pos-header h2 { margin:0; color:#2c3e50; display:flex; align-items:center; gap:8px; }
        .pos-grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:16px; }
        .panel { border:1px solid #e6edf8; border-radius:12px; padding:14px; background:#fbfdff; }
        .panel h3 { margin:0 0 12px; color:#34495e; font-size:1rem; }
        .table-wrap { overflow:auto; }
        table { width:100%; border-collapse:collapse; min-width:620px; }
        th, td { padding:10px; border-bottom:1px solid #e9eef7; text-align:left; font-size:.9rem; }
        th { background:#f2f6fd; color:#3f587a; text-transform:uppercase; font-size:.75rem; letter-spacing:.3px; }
        .qty-input { width:80px; padding:6px; border:1px solid #cfd9ea; border-radius:8px; }
        .btn-add { border:none; background:#667eea; color:#fff; border-radius:8px; padding:7px 10px; cursor:pointer; }
        .btn-add:hover { background:#5b72d8; }
        .cart-total { display:flex; justify-content:space-between; margin-top:14px; padding-top:10px; border-top:2px solid #e5ecf8; font-weight:700; color:#1f3552; }
        .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
        .btn-save { border:none; background:linear-gradient(135deg, #00cc44 0%, #00a638 100%); color:#fff; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:600; }
        .btn-clear { border:none; background:#6c757d; color:#fff; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:600; }
        .alert { border-radius:10px; padding:12px 14px; margin-bottom:14px; font-weight:600; }
        .alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
        .alert-error { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
        .empty-note { color:#6b7d96; font-size:.88rem; padding:8px 0; }
        @media (max-width: 1100px) { .pos-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
  <header class="header">
    <div class="logo" style="cursor: default;">
      <img th:src="@{/frontend/imagenes/logo technova.png}" alt="Logo">
      <span>TECHNOVA</span>
    </div>
    <div class="acciones-usuario">
      <a th:href="@{/empleado/perfil}" class="account"><i class='bx bx-user-circle'></i> <span>Perfil</span></a>
      <form method="POST" th:action="@{/logout}" style="display:inline;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" style="background:none;border:none;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;" class="account">
          <i class='bx bx-log-out'></i> <span>Cerrar Sesión</span>
        </button>
      </form>
    </div>
  </header>

  <div class="dashboard-wrapper">
    <div th:replace="~{frontend/layouts/sidebar-empleado :: sidebar}"></div>

    <main class="main-content">
      <div class="pos-container">
        <div class="pos-header">
          <h2><i class='bx bx-store'></i> Venta en Punto Físico</h2>
          <span th:text="'Empleado: ' + ${usuario != null ? usuario.name : 'N/A'}" style="color:#60738e;font-weight:600;">Empleado</span>
        </div>

        <div th:if="${mensaje}" class="alert" th:classappend="${tipoMensaje == 'success' ? 'alert-success' : 'alert-error'}">
          <span th:text="${mensaje}"></span>
        </div>

        <div class="pos-grid">
          <section class="panel">
            <h3>Productos disponibles</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Stock</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}">Producto</td>
                    <td th:text="${p.stock}">0</td>
                    <td>
                      $<span th:text="${p.caracteristica != null && p.caracteristica.precioVenta != null ? #numbers.formatDecimal(p.caracteristica.precioVenta, 0, 'POINT', 2, 'POINT') : '0.00'}">0.00</span>
                    </td>
                    <td>
                      <input class="qty-input"
                             type="number"
                             min="1"
                             th:max="${p.stock}"
                             value="1"
                             th:id="${'qty-' + p.id}">
                    </td>
                    <td>
                      <button type="button"
                              class="btn-add"
                              th:attr="data-id=${p.id},data-nombre=${p.nombre},data-stock=${p.stock},data-precio=${p.caracteristica != null && p.caracteristica.precioVenta != null ? p.caracteristica.precioVenta : 0}"
                              onclick="agregarItem(this)">
                        Agregar
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <section class="panel">
            <h3>Resumen de la venta</h3>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Cant.</th>
                    <th>Subtotal</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="cartRows">
                  <tr><td colspan="4" class="empty-note">Aún no agregas productos.</td></tr>
                </tbody>
              </table>
            </div>

            <div class="cart-total">
              <span>Total</span>
              <span id="cartTotal">$ 0</span>
            </div>

            <form method="POST" th:action="@{/empleado/ventas/punto-fisico/registrar}" id="saleForm">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <div id="itemsContainer"></div>
              <div class="actions">
                <button type="button" class="btn-clear" onclick="limpiarCarrito()">Limpiar</button>
                <button type="submit" class="btn-save">Registrar venta</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>&copy; 2025 Technova</p>
  </footer>

  <script>
    const cart = [];

    function moneda(valor) {
      return '$ ' + Number(valor || 0).toLocaleString('es-CO');
    }

    function agregarItem(btn) {
      const id = Number(btn.dataset.id);
      const nombre = btn.dataset.nombre;
      const stock = Number(btn.dataset.stock || 0);
      const precio = Number(btn.dataset.precio || 0);
      const qtyInput = document.getElementById('qty-' + id);
      const cantidad = Number(qtyInput ? qtyInput.value : 1);

      if (!cantidad || cantidad < 1) return;
      if (cantidad > stock) {
        alert('La cantidad supera el stock disponible.');
        return;
      }

      const existente = cart.find(x => x.productoId === id);
      if (existente) {
        const nuevaCantidad = existente.cantidad + cantidad;
        if (nuevaCantidad > stock) {
          alert('No hay stock suficiente para sumar esa cantidad.');
          return;
        }
        existente.cantidad = nuevaCantidad;
      } else {
        cart.push({ productoId: id, nombre, cantidad, precio, stock });
      }
      renderCart();
    }

    function eliminarItem(productoId) {
      const idx = cart.findIndex(x => x.productoId === productoId);
      if (idx >= 0) {
        cart.splice(idx, 1);
        renderCart();
      }
    }

    function limpiarCarrito() {
      cart.splice(0, cart.length);
      renderCart();
    }

    function renderCart() {
      const rows = document.getElementById('cartRows');
      const itemsContainer = document.getElementById('itemsContainer');
      const cartTotal = document.getElementById('cartTotal');

      rows.innerHTML = '';
      itemsContainer.innerHTML = '';

      if (cart.length === 0) {
        rows.innerHTML = '<tr><td colspan="4" class="empty-note">Aún no agregas productos.</td></tr>';
        cartTotal.textContent = moneda(0);
        return;
      }

      let total = 0;
      cart.forEach((item, index) => {
        const subtotal = item.cantidad * item.precio;
        total += subtotal;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.nombre}</td>
          <td>${item.cantidad}</td>
          <td>${moneda(subtotal)}</td>
          <td><button type="button" class="btn-add" onclick="eliminarItem(${item.productoId})">Quitar</button></td>
        `;
        rows.appendChild(tr);

        const productoInput = document.createElement('input');
        productoInput.type = 'hidden';
        productoInput.name = 'productoId';
        productoInput.value = item.productoId;
        itemsContainer.appendChild(productoInput);

        const cantidadInput = document.createElement('input');
        cantidadInput.type = 'hidden';
        cantidadInput.name = 'cantidad';
        cantidadInput.value = item.cantidad;
        itemsContainer.appendChild(cantidadInput);
      });

      cartTotal.textContent = moneda(total);
    }

    document.getElementById('saleForm').addEventListener('submit', function(e) {
      if (cart.length === 0) {
        e.preventDefault();
        alert('Agrega al menos un producto para registrar la venta.');
      }
    });
  </script>
</body>
</html>
